url: https://stufield.github.io/mixr/

development:
  mode: auto

authors:
  Stu Field:
    href: https://github.com/stufield

home:
  links:
  - text: Learn more about me
    href: https://github.com/stufield

template:
  bootstrap: 5
  package: tidytemplate
  bslib:
    bg: "#202123"      # dark theme
    fg: "#B8BCC2"      # dark theme
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    base_font: {google: "Roboto"}

navbar:
  structure:
    left: [intro, reference, articles, workflows, news]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/mixr.html

articles:
  - title: Get Started
    contents:
    - mixr


reference:
  - title: Fit Mixed-effects Models
    desc: >
      Fit an individual model (safely) or multiple models for
      each feature and return each as a univariate table.
    contents:
    - cross_validate_glmm_lasso
    - starts_with("fit")

  - title: Create Univariate Table
    desc: >
      Generate a table of univariate mixed-effects models.
    contents:
    - create_mixed_effects_tbl

  - title: Model Diagnostics
    desc: >
      Model fitting diagnostics plot for LME models.
    contents:
    - lme_diagnostic

  - title: Simple LMEs
    desc: >
      Fit a simple LME model with various fixed- and random-effects.
    contents:
    - simple_lme

  - title: Simulate Data
    desc: >
      Simulate longitudinal data with various covariance structures.
    contents:
    - create_long_data
    - simulate_long_data

news:
  - one_page: true
